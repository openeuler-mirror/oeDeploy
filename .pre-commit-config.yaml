# 修复模式：仅对暂存区文件生效；存量仓库请勿运行 pre-commit run --all-files
minimum_pre_commit_version: "4.0"

repos:
  # ===== 通用基础 hook（所有语言） =====
  - repo: https://gitcode.com/gh_mirrors/pr/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace          # 修复：移除行尾空白
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|.*\.lock)$
      - id: end-of-file-fixer            # 修复：确保文件以单个换行结尾
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|.*\.lock)$
      - id: check-yaml
        # 基线预检发现 12 个坏 YAML（Jinja/Helm 模板中未转义引号、未加引号的 {{ }}），
        # 属真实数据缺陷，进清理 PR 修复，不用 exclude 绕过
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 仓库 plugins/*/workspace/requires/ 下存在 ~5.8MB 的 vendored tar.gz，
        # 按存量最大文件放宽到 8MB；如需收紧先完成大文件清理
        args: [--maxkb=8192]
      - id: detect-private-key

  # ===== 密钥检测 =====
  - repo: https://gitcode.com/gh_mirrors/gi/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ===== 拼写检查 =====
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--skip=*.lock,node_modules,.next,coverage,build,dist,vendor,third_party,json_tmp,*.egg-info"]
        # BoostKit-AccLib 为仓库内 vendored 第三方代码，不纳入拼写检查
        exclude: ^(vendor/|third_party/|generated/|.*/BoostKit-AccLib/)

  # ===== Python：Ruff（修复）+ Bandit（检查） =====
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check                  # 修复模式；只读档去掉 --fix
        args: [--fix]
      - id: ruff-format                 # 修复模式；只读档加 --check

  - repo: https://gitcode.com/gh_mirrors/ba/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-lll]                    # 存量仓库先只看高危；清理后按路线图放开 -ll → 全量

  # ===== Shell：Shfmt（修复）+ ShellCheck（检查） =====
  - repo: https://gh-proxy.com/https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt                       # 修复模式无需加参数（manifest 已内置 --write）

  - repo: https://gh-proxy.com/https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]        # 存量默认 error 起步；清理 PR 后按基线收紧回 warning

  # ===== Markdown：markdownlint（修复） =====
  - repo: https://gitcode.com/gh_mirrors/ma/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]                   # 修复模式；只读档去掉 --fix
