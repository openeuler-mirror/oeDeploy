name: dify
version: 1.0.0
url: https://atomgit.com/openeuler/oeDeploy/tree/master/plugins/dify
description: oeDeploy plugin for dify fast deployment
description_zh: 帮助开发者在本地快速部署dify的oeDeploy插件
description_en: The oeDeploy plugin that helps developers quickly deploy the dify locally.
type: app
localhost_available: true
action:
  install:
    description: Install Dify
    tasks:
      - name: Check env
        playbook: check-env.yaml
        scope: all
      - name: Install Docker
        playbook: install-docker.yaml
        scope: all
      - name: Install Dify
        playbook: install-dify.yaml
        scope: all
  uninstall:
    description: Uninstall Dify
    tasks:
      - name: Uninstall Dify
        playbook: uninstall-dify.yaml
        scope: all