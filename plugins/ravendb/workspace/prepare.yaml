---
- hosts: all
  become: yes
  gather_facts: false
  tasks:
    - name: Install required packages
      yum:
        name:
          - python3-libselinux
          - wget
          - curl
          - rsync
          - unzip
          - java-11-openjdk
        state: present
    - name: Create ravendb user
      user:
        name: "{{ ravendb_user }}"
        state: present
        createhome: no
        shell: /bin/false
    - name: Create data directory
      file:
        path: "{{ ravendb_data_path }}"
        state: directory
        owner: "{{ ravendb_user }}"
        group: "{{ ravendb_user }}"
        mode: '0755'
    - name: Create log directory
      file:
        path: "{{ ravendb_log_path }}"
        state: directory
        owner: "{{ ravendb_user }}"
        group: "{{ ravendb_user }}"
        mode: '0755'
    - name: Create install directory
      file:
        path: "{{ ravendb_install_path }}"
        state: directory
        owner: "{{ ravendb_user }}"
        group: "{{ ravendb_user }}"
        mode: '0755'