name: kubeflow-1.9.1
version: 1.0.0
url: https://gitee.com/openeuler/oeDeploy/tree/master/plugins/kubeflow-1.9.1
description: oeDeploy plugin for kubeflow fast deployment
description_zh: 帮助开发者在本地快速部署kubeflow的oeDeploy插件。请确保当前节点是kubernetes集群的master节点。
description_en: >
  The oeDeploy plugin that helps developers quickly deploy kubeflow locally. 
  Please ensure that the current node is the master node of the kubernetes cluster.
type: app
localhost_available: true
action:
  install:
    description: install Kubeflow
    tasks:
      - name: install kubeflow
        playbook: install.yml
        scope: all
  install-kserve:
    description: install KServe based on Kubeflow
    tasks:
      - name: install KServe
        playbook: install-kserve.yml
        scope: all
  install-katib:
    description: install Katib based on Kubeflow
    tasks:
      - name: install Katib
        playbook: install-katib.yml
        scope: all
  uninstall:
    description: uninstall Kubeflow
    tasks:
      - name: uninstall kubeflow
        playbook: uninstall.yml
        scope: all
  uninstall-kserve:
    description: uninstall KServe
    tasks:
      - name: uninstall KServe
        playbook: uninstall-kserve.yml
        scope: all
  uninstall-katib:
    description: uninstall Katib
    tasks:
      - name: uninstall Katib
        playbook: uninstall-katib.yml
        scope: all
  clean:
    description: clean cache files
    tasks:
      - name: clean cache files
        playbook: clean.yml
        scope: all