all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    # Python版本
    python_version: "3.9"
    # 虚拟环境名称
    venv_name: "python-llm-env"
    # 虚拟环境路径
    venv_path: "/opt/{{ venv_name }}"
    # 安装模式: system(系统Python)或venv(虚拟环境)
    install_mode: "venv"
    # LLM库版本
    langchain_version: "latest"
    openai_version: "latest"
    llama_index_version: "latest"
    # 额外安装的库
    extra_packages:
      - numpy
      - pandas
      - scikit-learn
      - matplotlib
      - jupyter
      - ipython
      - seaborn
      - scipy
      - plotly
      - tqdm
      - Pillow
      - opencv-python
      - transformers
      - datasets
      - tokenizers
      - sentence-transformers
      - pyarrow
      - fasttext
      - textblob
      - wordcloud
      - pattern
      - requests
      - beautifulsoup4
      - lxml
      - pymupdf
      - pypdf
      - docx2txt
      - python-docx
      - unstructured
      - chromadb
      - faiss-cpu
      - pinecone-client
      - weaviate-client
      - redis
      - pymongo
      - psycopg2-binary
      - sqlalchemy
      - pydantic
      - pydantic-settings
      - rich
      - click
      - colorama
      - python-dotenv
    # 下载超时时间(秒)
    download_timeout: 600
    # 下载重试次数
    download_retry: 3
    # 镜像源
    pip_mirror: "https://pypi.tuna.tsinghua.edu.cn/simple"
    # SSH连接参数
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    # 性能优化参数
    ansible_ssh_args: '-o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=30'
    ansible_pipelining: True
    ansible_ssh_pipelining: True
    ansible_forks: 10