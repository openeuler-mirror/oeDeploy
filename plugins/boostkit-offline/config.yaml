all:
  hosts:
    host1:
      ansible_host: HOST_IP     # e.g. 192.168.1.101
      ansible_port: 22
      ansible_user: root
      ansible_password: ""
    # 可在此添加更多主机
  children:
    AccLib:
      hosts:
        host1:
        # 可在此包含更多主机
      vars:
        install_list: 'ALL'    # 支持使用列表，或者使用逗号分隔的字符串
  vars:
    # 跳过所有基本检查项
    skip_check: false
    # 临时文件存放目录
    temp_path: /tmp
    # 跳过 ssh 校验，如需禁用此功能，请删除以下配置项
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
