- name: Install Docker
  hosts: all
  become: yes

  vars:
    MIN_DOCKER_VERSION: "24.0.0"
    DOCKER_PKGS:
      - docker-client
      - docker-compose
      - docker-engine
    DOCKER_CONF_PATH: /etc/docker/daemon.json

  tasks:
    - name: Check if Docker is installed
      ansible.builtin.command: "docker --version"
      register: docker_check
      ignore_errors: yes
      changed_when: false
      tags: install

    - name: Get raw Docker version
      ansible.builtin.shell: |
        docker --version 2>/dev/null | awk -F'[ ,]' '/version/ {print $3}' | tr -d ' '
      register: docker_version_raw
      changed_when: false
      args:
        executable: /bin/bash
      when: docker_check is succeeded
      tags: install

    - name: Extract docker version
      ansible.builtin.set_fact:
        installed_docker_version: "{{ docker_version_raw.stdout | trim | default('unknown') }}"
      when: docker_check is succeeded
      tags: install

    - name: Validate version format
      ansible.builtin.assert:
        that:
          - installed_docker_version is match('^\\d+\\.\\d+\\.\\d+$')
        fail_msg: "Docker version extraction failed, current value: {{ installed_docker_version }}"
      when: docker_check is succeeded and installed_docker_version != 'unknown'
      tags: install

    - name: Determine installation requirement
      ansible.builtin.set_fact:
        requires_installation: >-
          {{
            docker_check is failed or
            (
              (installed_docker_version | default('0.0.0', true) | trim)
              is version( 
                MIN_DOCKER_VERSION,
                '<'
              )
            )
          }}
      tags: install

    - name: Install Docker packages
      ansible.builtin.yum:
        name: "{{ DOCKER_PKGS }}"
        state: latest
        update_cache: yes
      when: requires_installation
      notify: Start docker service
      tags: install

    - name: Get raw Docker version after installation
      ansible.builtin.shell: |
        docker --version 2>/dev/null | awk -F'[ ,]' '/version/ {print $3}' | tr -d ' '
      register: docker_version_raw
      changed_when: false
      args:
        executable: /bin/bash
      when: requires_installation
      tags: install

    - name: Extract docker version after installation
      ansible.builtin.set_fact:
        installed_docker_version: "{{ docker_version_raw.stdout | trim | default('unknown') }}"
      when: requires_installation
      tags: install

    - name: Validate version after installation
      ansible.builtin.assert:
        that: >-
          {{ 
            (installed_docker_version | default('0.0.0', true) | trim) 
            is version(MIN_DOCKER_VERSION, '>=') 
          }}
        fail_msg: "Docker version check FAILED after installation!"
        success_msg: "Docker version check PASSED"
      when: requires_installation
      tags: install

    - name: Deploy new configuration template
      ansible.builtin.template:
        src: daemon.j2
        dest: "{{ DOCKER_CONF_PATH }}"
        mode: "0644"
        backup: yes
      notify: Restart docker service

  handlers:
    - name: Clean yum cache
      ansible.builtin.command: "yum clean all"
      listen: "Clean yum cache"

    - name: Start docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
      listen: "Start docker service"

    - name: Restart docker service
      ansible.builtin.service:
        name: docker
        state: restarted
        enabled: yes
        daemon_reload: yes
      listen: "Restart docker service"
