name: ragflow
version: 1.0.0
url: https://gitee.com/openeuler/oeDeploy/tree/master/plugins/ragflow
description: oeDeploy plugin for ragflow fast deployment
description_zh: 帮助开发者在本地快速部署ragflow的oeDeploy插件。
description_en: The oeDeploy plugin that helps developers quickly deploy ragflow locally. 
type: app
localhost_available: true
action:
  install:
    description: Install RAGFlow
    tasks:
      - name: Check env
        playbook: check-env.yml
        scope: all
      - name: Set env
        playbook: set-env.yml
        scope: all
      - name: Install Docker
        playbook: install-docker.yml
        scope: all
      - name: Install RAGFlow
        playbook: install-ragflow.yml
        scope: all
  uninstall:
    description: Uninstall RAGFlow
    tasks:
      - name: Uninstall RAGFlow
        playbook: uninstall-ragflow.yml
        scope: all