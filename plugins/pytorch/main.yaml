name: pytorch
version: 1.0.0
url: https://gitee.com/openeuler/oeDeploy/tree/master/plugins/pytorch
description: oeDeploy plugin for pytorch fast deployment
description_zh: 帮助开发者在本地快速部署pytorch的oeDeploy插件。请确保当前节点是kubernetes集群的master节点。
description_en: >
  The oeDeploy plugin that helps developers quickly deploy pytorch locally. 
  Please ensure that the current node is the master node of the kubernetes cluster.
type: app
localhost_available: true
action:
  install:
    description: install pytorch
    tasks:
    - name: install pytorch
      playbook: install.yaml
      scope: all
  uninstall:
    description: uninstall pytorch
    tasks:
    - name: uninstall pytorch
      playbook: uninstall.yaml
      scope: all
  train:
    description: train cnn based on mnist on pytorch
    tasks:
    - name: train cnn based on mnist on pytorch
      playbook: train.yaml
      scope: all