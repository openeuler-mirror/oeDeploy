---
- hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Check if firmware is installed
      stat:
        path: /usr/local/Ascend/firmware/script/uninstall.sh
      register: firmware_installed

    - name: Skip firmware uninstallation if not installed
      debug:
        msg:
          - "=========================================="
          - "Ascend 固件未安装，跳过卸载步骤"
          - "=========================================="
      when: not firmware_installed.stat.exists

    - name: Uninstall Ascend firmware
      block:
        - name: Execute firmware uninstall script
          shell: /usr/local/Ascend/firmware/script/uninstall.sh
          register: uninstall_result
          ignore_errors: yes

        - name: Display firmware uninstallation result
          debug:
            msg:
              - "=========================================="
              - "Ascend 固件卸载结果"
              - "=========================================="
              - "{{ uninstall_result.stdout_lines | default([]) }}"
              - "{{ uninstall_result.stderr_lines | default([]) }}"
              - "返回码: {{ uninstall_result.rc }}"
              - "=========================================="

        - name: Check firmware uninstallation status
          stat:
            path: /usr/local/Ascend/firmware/script/uninstall.sh
          register: firmware_check

        - name: Firmware uninstallation status
          debug:
            msg:
              - "=========================================="
              - "固件卸载状态: {{ '成功' if not firmware_check.stat.exists else '失败' }}"
              - "=========================================="

      when: firmware_installed.stat.exists
