- hosts:
  - masters
  - workers
  roles:
  - prepare/base
  - prepare/nameserver
  - { role: prepare/containerd, when: "runtime == 'containerd'" }
  - { role: prepare/docker, when: "runtime == 'docker'" }
  - prepare/kubernetes
  - prepare/images

- hosts: masters
  roles:
  - { role: loadbalancer, when: "groups['masters'] | length > 1" }
  - master

- hosts: workers
  roles:
  - worker

- hosts:
  - masters
  - workers
  roles:
  - plugins/calico

#- hosts: ingress
#  roles:
#  - plugins/ingress

