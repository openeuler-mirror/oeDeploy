[masters]
; k8s master节点（单个或多个master节点，高可用场景建议3个及以上）
ebs-master-1

[ingress]
; k8s ingress-nginx部署节点
ebs-master-1

[workers]
; k8s worker节点
ebs-master-2
xt1
at1

[new-workers]
; 新加入到集群的节点，在这里添加，当playbook执行完成后，将节点移动到workers下
# xt-2

[all:vars]
; true: 无论之前集群是否创建成功，都会尝试初始化集群
init_cluster_force="true"
; true：移除master不可调度的污点，使业务容器可以调度到master节点上
remove_master_no_schedule_taints="true"
; 容器网段一定要合理划分！！！尽可能不与虚机网段冲突
service_cidr="10.96.0.0/16"
pod_cidr="10.244.0.0/16"
; ca根证书为10年，故证书过期时间不应超过10年
certs_expired="3650"
; 负载均衡端口，当master节点数量大于1时生效
; lb_kube_apiserver_ip=""
lb_kube_apiserver_port="8443"

; 当离线包制作完成后，以下参数不可修改
; kubernetes版本
kubernetes_version="1.31.1"
; 网络插件 calico
calico_version="3.28.2"
; 网络插件 ingress
ingress_version="1.12.0"
; 容器运行时支持版本
containerd_version="1.7.22"
docker_version="27.3.1"
pause_image="registry.k8s.io/pause:3.10"
;ingress 相关参数
ingress_type="NodePort"
ingress_http_node_port="30080"
ingress_https_node_port="30443"
ingress_http_container_port="10080"
ingress_https_container_port="10443"
