- name: Label ingress node
  shell: |
    k8s_node_name=$(kubectl get nodes -o wide | grep "{{ hostvars[item]['ansible_host'] }} " | cut -d' ' -f1)
    kubectl label node $k8s_node_name ingress-nginx="true"
  with_items: "{{ groups['ingress'][0] }}"
  delegate_to: "{{ groups['masters'][0] }}"

- name: Prepare images directories
  file: name={{ images_dir }}/plugin/ingress state=directory

- name: Copy ingress images to master nodes
  copy:
    src: "{{ architecture }}/{{ item }}"
    dest: "{{ images_dir }}/plugin/ingress"
  with_items:
  - controller.tar
  - kube-webhook-certgen.tar
  when: inventory_hostname == groups['ingress'][0]

- name: Load ingress images on master nodes
  command: "ctr -n k8s.io images import {{ images_dir }}/plugin/ingress/{{ item }}"
  with_items:
  - controller.tar
  - kube-webhook-certgen.tar
  when:
  - runtime == "containerd"
  - inventory_hostname == groups['ingress'][0]

- name: Load ingress images on master nodes
  command: "docker load -i {{ images_dir }}/plugin/ingress/{{ item }}"
  with_items:
  - controller.tar
  - kube-webhook-certgen.tar
  when:
  - runtime == "docker"
  - inventory_hostname == groups['ingress'][0]

- name: Create ingress directory
  file: name=/etc/kubernetes/plugins/ingress state=directory
  when: inventory_hostname == groups['ingress'][0]

- name: Create ingress yaml file
  template:
    src: ingress-nginx.yaml.j2
    dest: "/etc/kubernetes/plugins/ingress/ingress-nginx.yaml"
    mode: "0644"
  when: inventory_hostname == groups['ingress'][0]

- name: Apply ingress plugin
  shell: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /etc/kubernetes/plugins/ingress/
  delegate_to: "{{ groups['masters'][0] }}"
