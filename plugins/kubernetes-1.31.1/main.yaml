name: kubernetes
version: 1.0.0
url: https://atomgit.com/openeuler/oeDeploy/tree/master/plugins/kubernetes-1.31.1
description: oeDeploy plugin for kubernetes-1.31.1 fast deployment
description_zh: 帮助开发者在本地快速部署kubernetes-1.31.1的oeDeploy插件。
description_en: The oeDeploy plugin that helps developers quickly deploy kubernetes-1.31.1 locally. 
type: app
localhost_available: false
action:
  install:
    description: install kubernetes
    tasks:
      - name: install kubernetes
        playbook: init-k8s.yml
        vars: variables.yml
        scope: all
  add-workers:
    description: add new workers
    tasks:
      - name: add new workers
        playbook: add-node.yml
        vars: variables.yml
        scope: all
  uninstall:
    description: delete kubernetes
    tasks:
      - name: delete kubernetes
        playbook: delete-k8s.yml
        vars: variables.yml
        scope: all
  clean:
    description: clean cache files
    tasks:
      - name: clean cache files
        playbook: clean-k8s.yml
        scope: all