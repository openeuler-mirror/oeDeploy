name: helm
version: 1.0.0
url: https://atomgit.com/openeuler/oeDeploy/tree/master/plugins/helm
description: oeDeploy plugin for helm(default v3.17.3) fast deployment
description_zh: 帮助开发者在本地快速部署helm(默认版本v3.17.3)工具的oeDeploy插件
description_en: The oeDeploy plugin helps developers quickly deploy the helm(default v3.17.3) locally
type: app
localhost_available: true
action:
  install:
    description: install helm
    tasks:
      - name: install helm
        playbook: install.yml
        scope: all
  uninstall:
    description: uninstall helm
    tasks:
      - name: uninstall helm
        playbook: uninstall.yml
        scope: all
