all:
  hosts:
    target-host:
      ansible_host: 127.0.0.1
      ansible_port: 22
      ansible_user: root
      ansible_password: ""
  vars:
    # Agent SDK类型，可选项: pyautogen, agno, crewai, google-generativeai, haystack-ai, langchain, openai, smolagents
    agent_sdk: langchain
    
    # pip源配置
    pip_index_url: https://mirrors.huaweicloud.com/repository/pypi/simple
    pip_trusted_host: mirrors.huaweicloud.com
    
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'


