---
- hosts: all
  become: yes
  gather_facts: yes
  vars:
    agent_types_config: "{{ playbook_dir }}/agent_types.yaml"
  tasks:
    # 确保python3和pip可用
    - name: Check if python3 is installed
      command: python3 --version
      register: python3_check
      ignore_errors: yes
      changed_when: false

    - name: Install python3 if not present
      yum:
        name: python3
        state: present
      when: python3_check.rc != 0

    - name: Verify python3 installation
      command: python3 --version
      register: python3_version
      changed_when: false

    - name: Display python3 version
      debug:
        msg: "Python3 is available: {{ python3_version.stdout }}"

    - name: Check if pip3 is installed
      command: python3 -m pip --version
      register: pip_check
      ignore_errors: yes
      changed_when: false

    - name: Install pip if not present
      yum:
        name: python3-pip
        state: present
      when: pip_check.rc != 0

    - name: Verify pip installation
      command: python3 -m pip --version
      register: pip_version
      changed_when: false

    - name: Display pip version
      debug:
        msg: "pip is available: {{ pip_version.stdout }}"

    # 安装python3-libselinux用于文件操作
    - name: Install python3-libselinux
      yum:
        name: python3-libselinux
        state: present

    # 读取agent_types配置
    - name: Load agent types configuration
      include_vars:
        file: "{{ agent_types_config }}"
        name: agent_config

    - name: Validate agent_sdk parameter
      fail:
        msg: "Invalid agent_sdk '{{ agent_sdk }}'. Must be one of: {{ agent_config.agents.keys() | list | join(', ') }}"
      when: agent_sdk not in agent_config.agents

    - name: Display selected Agent SDK
      debug:
        msg:
          - "========================================"
          - "Installing Agent SDK: {{ agent_sdk }}"
          - "Description: {{ agent_config.agents[agent_sdk].description }}"
          - "========================================"

    # 获取要安装的包列表
    - name: Get packages to install
      set_fact:
        packages_to_install: "{{ agent_config.agents[agent_sdk].packages }}"

    - name: Display packages to install
      debug:
        msg: "Packages: {{ packages_to_install | join(', ') }}"

    # 使用pip安装指定的包（使用command模块确保安装生效）
    - name: Install Agent SDK packages
      command: >
        python3 -m pip install
        {{ packages_to_install | join(' ') }}
        --trusted-host {{ pip_trusted_host }}
        -i {{ pip_index_url }}
      register: pip_install_result
      changed_when: "'Successfully installed' in pip_install_result.stdout or 'Requirement already satisfied' in pip_install_result.stdout"

    - name: Display installation result
      debug:
        msg: "{{ pip_install_result.stdout_lines }}"

    # 复制demo脚本到临时目录
    - name: Create temporary directory for demo
      tempfile:
        state: directory
        suffix: _agent_demo
      register: temp_demo_dir

    - name: Copy demo script to temporary directory
      copy:
        src: "{{ agent_config.agents[agent_sdk].demo }}"
        dest: "{{ temp_demo_dir.path }}/demo.py"
        mode: '0755'

    # 执行demo验证安装
    - name: Run demo script to verify installation
      command: python3 {{ temp_demo_dir.path }}/demo.py
      register: demo_result
      changed_when: false

    - name: Display demo execution result
      debug:
        msg: "{{ demo_result.stdout_lines }}"

    - name: Check if demo executed successfully
      fail:
        msg: "Demo execution failed. Installation may not be complete."
      when: demo_result.rc != 0

    # 清理临时文件
    - name: Clean up temporary directory
      file:
        path: "{{ temp_demo_dir.path }}"
        state: absent

    # 最终成功消息
    - name: Installation completed successfully
      debug:
        msg:
          - "========================================"
          - "Agent SDK Installation Complete!"
          - "SDK: {{ agent_sdk }}"
          - "Status: SUCCESS"
          - "========================================"

