- name: "[Dependency] Install python3-libselinux"
  yum:
    name: python3-libselinux
    state: present
  tags: dependency

- name: "[Cleanup] Remove temporary files and directories"
  file:
    path: "{{ temp_path }}/BoostKit-AccLib"
    state: absent
  tags: cleanup

- name: "[File] Ensure destination directory exists"
  file:
    path: "{{ temp_path }}"
    state: directory
  tags: file_transfer

- name: "[File] Transfer local file to remote host"
  copy:
    src: "BoostKit-AccLib"
    dest: "{{ temp_path }}"
  tags: file_transfer

- name: "[File] Copy version.xml to remote host"
  template:
    src: "version.xml.j2"
    dest: "{{ temp_path }}/BoostKit-AccLib/scripts/version.xml"
  tags: file_transfer
