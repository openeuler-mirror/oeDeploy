---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Validate NNAL type configuration
      fail:
        msg: "不支持的NNAL类型: {{ nnal_type }}. 支持的类型: ATB, SiP"
      when: nnal_type not in ['ATB', 'SiP']

    - name: Install NNAL neural network acceleration library
      shell: script -q -c 'yum install -y "{{ cann_packages.nnal }}"' /dev/null
      register: nnal_install_result

    - name: Display NNAL installation result
      debug:
        msg:
          - "========================================"
          - "CANN NNAL 神经网络加速库安装操作完成"
          - "包名: {{ cann_packages.nnal }}"
          - "状态: {{ 'Success' if nnal_install_result.rc == 0 else 'Failed' }}"
          - "========================================"

    - name: Set NNAL environment variable script path
      set_fact:
        nnal_env_script: "{{ env_scripts.nnal_atb if nnal_type == 'ATB' else env_scripts.nnal_sip }}"
        other_nnal_env_script: "{{ env_scripts.nnal_sip if nnal_type == 'ATB' else env_scripts.nnal_atb }}"

    - name: Check if NNAL environment variable script exists
      stat:
        path: "{{ nnal_env_script }}"
      register: nnal_env_script_stat

    - name: Display NNAL installation error message
      debug:
        msg:
          - "========================================"
          - "错误: NNAL安装可能有问题"
          - "找不到环境变量脚本: {{ nnal_env_script }}"
          - "NNAL类型: {{ nnal_type }}"
          - "请检查安装包是否正确安装"
          - "========================================"
      when: not nnal_env_script_stat.stat.exists

    - name: Fail if NNAL environment variable script not found
      fail:
        msg: "NNAL环境变量脚本不存在，安装失败"
      when: not nnal_env_script_stat.stat.exists

    - name: Check if current NNAL environment variables are configured
      shell: grep -q "{{ nnal_env_script }}" /root/.bashrc
      register: nnal_env_check
      failed_when: false
      changed_when: false
      become: no
      when: nnal_env_script_stat.stat.exists and not skip_env_config

    - name: Check if other NNAL environment variables are configured (need to remove)
      shell: grep -q "{{ other_nnal_env_script }}" /root/.bashrc
      register: other_nnal_env_check
      failed_when: false
      changed_when: false
      become: no
      when: not skip_env_config

    - name: Remove other NNAL environment variable configurations
      lineinfile:
        path: /root/.bashrc
        regexp: ".*{{ other_nnal_env_script }}.*"
        state: absent
        backup: yes
      when: other_nnal_env_check.rc == 0 and not skip_env_config
      become: no
      register: other_nnal_env_removed

    - name: Display NNAL environment variable conflict handling information
      debug:
        msg:
          - "========================================"
          - "已移除冲突的NNAL环境变量配置"
          - "移除的脚本: {{ other_nnal_env_script }}"
          - "NNAL不支持同时配置ATB和SiP加速库"
          - "========================================"
      when: other_nnal_env_removed.changed

    - name: Configure NNAL environment variables to .bashrc
      lineinfile:
        path: /root/.bashrc
        line: "source {{ nnal_env_script }}"
        create: yes
        backup: yes
      when: nnal_env_script_stat.stat.exists and nnal_env_check.rc != 0 and not skip_env_config
      become: no
      register: nnal_env_configured

    - name: Display environment variable configuration reminder
      debug:
        msg: "{{ env_reminder_message }}"
      when: nnal_env_configured.changed or other_nnal_env_removed.changed

