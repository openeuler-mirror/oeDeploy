---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Set Kernels package name variable
      set_fact:
        kernels_package_name: "{{ kernels_packages[hardware_model] }}"

    - name: Validate hardware model configuration
      fail:
        msg: "不支持的硬件型号: {{ hardware_model }}. 支持的型号: {{ kernels_packages.keys() | list | join(', ') }}"
      when: hardware_model not in kernels_packages

    - name: Install Kernels operator package
      shell: script -q -c 'yum install -y "{{ kernels_package_name }}"' /dev/null
      register: kernels_install_result

    - name: Display Kernels installation result
      debug:
        msg:
          - "========================================"
          - "CANN Kernels 算子包安装操作完成"
          - "硬件型号: {{ hardware_model }}"
          - "包名: {{ kernels_package_name }}"
          - "状态: {{ 'Success' if kernels_install_result.rc == 0 else 'Failed' }}"
          - "========================================"

