---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Uninstall NNAL neural network acceleration library
      shell: script -q -c 'yum remove -y "{{ cann_packages.nnal }}"' /dev/null
      register: nnal_uninstall_result
      failed_when: false

    - name: Display NNAL uninstallation result
      debug:
        msg:
          - "========================================"
          - "CANN NNAL 神经网络加速库卸载操作完成"
          - "包名: {{ cann_packages.nnal }}"
          - "状态: {{ 'Success' if nnal_uninstall_result.rc == 0 else 'Failed' }}"
          - "========================================"

    - name: Check if NNAL ATB environment variables are configured
      shell: grep -q "{{ env_scripts.nnal_atb }}" /root/.bashrc
      register: nnal_atb_env_check
      failed_when: false
      changed_when: false
      become: no

    - name: Check if NNAL SiP environment variables are configured
      shell: grep -q "{{ env_scripts.nnal_sip }}" /root/.bashrc
      register: nnal_sip_env_check
      failed_when: false
      changed_when: false
      become: no

    - name: Remove NNAL ATB environment variable configuration
      lineinfile:
        path: /root/.bashrc
        regexp: ".*{{ env_scripts.nnal_atb }}.*"
        state: absent
        backup: yes
      when: nnal_atb_env_check.rc == 0
      become: no
      register: nnal_atb_env_removed

    - name: Remove NNAL SiP environment variable configuration
      lineinfile:
        path: /root/.bashrc
        regexp: ".*{{ env_scripts.nnal_sip }}.*"
        state: absent
        backup: yes
      when: nnal_sip_env_check.rc == 0
      become: no
      register: nnal_sip_env_removed

    - name: Display environment variable removal reminder
      debug:
        msg:
          - "========================================"
          - "NNAL环境变量配置已从.bashrc中移除"
          - "已移除ATB和SiP相关配置"
          - "请执行以下命令使更改生效："
          - "source /root/.bashrc"
          - "========================================"
      when: nnal_atb_env_removed.changed or nnal_sip_env_removed.changed

