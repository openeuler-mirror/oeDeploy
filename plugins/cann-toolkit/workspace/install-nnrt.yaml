---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Install NNRT neural network runtime environment
      shell: script -q -c 'yum install -y "{{ cann_packages.nnrt }}"' /dev/null
      register: nnrt_install_result

    - name: Display NNRT installation result
      debug:
        msg:
          - "========================================"
          - "CANN NNRT 神经网络运行时环境安装操作完成"
          - "包名: {{ cann_packages.nnrt }}"
          - "状态: {{ 'Success' if nnrt_install_result.rc == 0 else 'Failed' }}"
          - "========================================"

    - name: Check if NNRT environment variable script exists
      stat:
        path: "{{ env_scripts.nnrt }}"
      register: nnrt_env_script

    - name: Display NNRT installation error message
      debug:
        msg:
          - "========================================"
          - "错误: NNRT安装可能有问题"
          - "找不到环境变量脚本: {{ env_scripts.nnrt }}"
          - "请检查安装包是否正确安装"
          - "========================================"
      when: not nnrt_env_script.stat.exists

    - name: Fail if NNRT environment variable script not found
      fail:
        msg: "NNRT环境变量脚本不存在，安装失败"
      when: not nnrt_env_script.stat.exists

    - name: Check if NNRT environment variables are configured
      shell: grep -q "{{ env_scripts.nnrt }}" /root/.bashrc
      register: nnrt_env_check
      failed_when: false
      changed_when: false
      become: no
      when: nnrt_env_script.stat.exists and not skip_env_config

    - name: Configure NNRT environment variables to .bashrc
      lineinfile:
        path: /root/.bashrc
        line: "source {{ env_scripts.nnrt }}"
        create: yes
        backup: yes
      when: nnrt_env_script.stat.exists and nnrt_env_check.rc != 0 and not skip_env_config
      become: no
      register: nnrt_env_configured

    - name: Display environment variable configuration reminder
      debug:
        msg: "{{ env_reminder_message }}"
      when: nnrt_env_configured.changed

