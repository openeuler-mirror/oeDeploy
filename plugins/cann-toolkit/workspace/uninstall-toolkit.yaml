---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Uninstall Toolkit development kit package
      shell: script -q -c 'yum remove -y "{{ cann_packages.toolkit }}"' /dev/null
      register: toolkit_uninstall_result
      failed_when: false

    - name: Display Toolkit uninstallation result
      debug:
        msg:
          - "========================================"
          - "CANN Toolkit 开发套件包卸载操作完成"
          - "包名: {{ cann_packages.toolkit }}"
          - "状态: {{ 'Success' if toolkit_uninstall_result.rc == 0 else 'Failed' }}"
          - "========================================"

    - name: Check if Toolkit environment variables are configured
      shell: grep -q "{{ env_scripts.toolkit }}" /root/.bashrc
      register: toolkit_env_check
      failed_when: false
      changed_when: false
      become: no

    - name: Remove Toolkit environment variable configuration
      lineinfile:
        path: /root/.bashrc
        regexp: ".*{{ env_scripts.toolkit }}.*"
        state: absent
        backup: yes
      when: toolkit_env_check.rc == 0
      become: no
      register: toolkit_env_removed

    - name: Display environment variable removal reminder
      debug:
        msg:
          - "========================================"
          - "Toolkit环境变量配置已从.bashrc中移除"
          - "请执行以下命令使更改生效："
          - "source /root/.bashrc"
          - "========================================"
      when: toolkit_env_removed.changed

