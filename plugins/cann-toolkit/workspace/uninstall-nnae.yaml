---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Uninstall NNAE neural network acceleration engine
      shell: script -q -c 'yum remove -y "{{ cann_packages.nnae }}"' /dev/null
      register: nnae_uninstall_result
      failed_when: false

    - name: Display NNAE uninstallation result
      debug:
        msg:
          - "========================================"
          - "CANN NNAE 神经网络加速引擎卸载操作完成"
          - "包名: {{ cann_packages.nnae }}"
          - "状态: {{ 'Success' if nnae_uninstall_result.rc == 0 else 'Failed' }}"
          - "========================================"

    - name: Check if NNAE environment variables are configured
      shell: grep -q "{{ env_scripts.nnae }}" /root/.bashrc
      register: nnae_env_check
      failed_when: false
      changed_when: false
      become: no

    - name: Remove NNAE environment variable configuration
      lineinfile:
        path: /root/.bashrc
        regexp: ".*{{ env_scripts.nnae }}.*"
        state: absent
        backup: yes
      when: nnae_env_check.rc == 0
      become: no
      register: nnae_env_removed

    - name: Display environment variable removal reminder
      debug:
        msg:
          - "========================================"
          - "NNAE环境变量配置已从.bashrc中移除"
          - "请执行以下命令使更改生效："
          - "source /root/.bashrc"
          - "========================================"
      when: nnae_env_removed.changed

