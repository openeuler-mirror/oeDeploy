name: devkit-pipeline-v1.1
version: 1.0.0
url: https://atomgit.com/openeuler/oeDeploy/tree/master/plugins/devkit-pipeline-v1.1
description: oeDeploy plugin for devkit-pipeline-v1.1 fast deployment
description_zh: 帮助开发者在本地快速部署devkit-pipeline-v1.1工具的oeDeploy插件
description_en: The oeDeploy plugin helps developers quickly deploy the devkit-pipeline-v1.1 tool locally
type: app
localhost_available: true
action:
  install:
    description: 安装devkit-pipeline-v1.1
    tasks:
      - name: 配置SSH免密登录
        playbook: setup-ssh.yml
        scope: controller
      - name: 下载并解压软件包
        playbook: download-package.yml
        scope: controller
      - name: 生成machine-auto.yaml配置文件
        playbook: generate-config.yml
        scope: controller
      - name: 执行部署命令
        playbook: run-deploy.yml
        scope: controller