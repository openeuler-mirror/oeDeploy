all:
  hosts:
    host1:
      # 部署节点 IP
      ansible_host: HOST_IP
      # 部署节点 SSH 端口
      ansible_port: PORT
      # 部署节点用户
      ansible_user: USER
      # 部署节点密码
      ansible_password: PASSWORD

  vars:
    # 部署日志目录
    log_dir: "/var/log/deploy-euler-copilot"

    # 源码仓库配置
    repo_config:
      # 源码 url
      url: "https://gitee.com/openeuler/euler-copilot-framework.git"
      # 源码仓放置目录
      dest_dir: "/opt/euler-copilot-framework"
      # 指定分支、tag 和 commit
      version: "master"
      # 是否覆盖本地修改
      force: yes

    # 模型配置
    models:
      # 用于问答的大模型；需要为OpenAI兼容接口
      answer:
        # [必填] 接口URL（无需带上“v1”后缀）
        endpoint: https://api.deepseek.com
        # [必填] 接口API Key；默认置空
        key: sk-xxx
        # [必填] 模型名称
        name: deepseek-chat
        # [必填] 模型最大上下文数；建议>=8192
        ctxLength: 8192
        # 模型最大输出长度，建议>=2048
        maxTokens: 8192
      # 用于Function Call的模型；建议使用特定推理框架
      functionCall:
        # 推理框架类型，默认为ollama
        # 可用的框架类型：["vllm", "sglang", "ollama", "openai"]
        backend: openai
        # 模型地址；不填则与问答模型一致
        endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
        # API Key；不填则与问答模型一致
        key: sk-xxx
        # 模型名称；不填则与问答模型一致
        name: qwen-plus
        # 模型最大上下文数；不填则与问答模型一致
        ctxLength:
        # 模型最大输出长度；不填则与问答模型一致
        maxTokens:
      # 用于数据向量化（Embedding）的模型
      embedding:
        # 推理框架类型，默认为openai
        # [必填] Embedding接口类型：["openai", "mindie"]
        type: openai
        # [必填] Embedding URL（需要带上“v1”后缀）
        endpoint: https://api.siliconflow.cn/v1
        # [必填] Embedding 模型API Key
        key: sk-xxx
        # [必填] Embedding 模型名称
        name: BAAI/bge-m3
