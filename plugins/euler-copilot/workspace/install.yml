- name: Install EulerCopilot
  hosts: all
  become: yes
  vars:
    timestamp: "{{ ansible_date_time.iso8601 }}"

  tasks:
    - name: Create log directory
      file:
        path: "{{ log_dir }}"
        state: directory
        mode: '0744'

    - name: Install python3-libselinux, git
      yum:
        name:
          - python3-libselinux
          - git
        state: present

    - name: git clone euler-copilot-framework
      ansible.builtin.git:
        repo: "{{ repo_config.url }}"
        dest: "{{ repo_config.dest_dir }}"
        version: "{{ repo_config.version }}"
        update: yes  # 如果目录存在，则执行 git pull 更新到指定 version
        force: "{{ repo_config.force }}"

    - name: Copy values.yaml template
      ansible.builtin.template:
        src: values.yaml.j2
        dest: "{{ repo_config.dest_dir }}/deploy/chart/euler_copilot/values.yaml"
        mode: "0644"
        backup: yes

    - name: Disable deploy-embedding.sh, deploy_deepseek.sh and install_ollama.sh script
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0770"                     # 可选：设置文件权限
        owner: root                      # 可选：设置文件所有者
        group: root                      # 可选：设置文件所属组
        backup: yes                      # 可选：启用备份
      loop:
        - { src: deploy-embedding.sh, dest: "{{ repo_config.dest_dir }}/deploy/scripts/3-install-ollama/install_ollama.sh" }
        - { src: deploy_deepseek.sh, dest: "{{ repo_config.dest_dir }}/deploy/scripts/4-deploy-deepseek/deploy_deepseek.sh" }
        - { src: install_ollama.sh, dest: "{{ repo_config.dest_dir }}/deploy/scripts/5-deploy-embedding/deploy-embedding.sh" }

    - name: Add execute permission to all deploy scripts recursively
      ansible.builtin.file:
        path: "{{ repo_config.dest_dir }}/deploy/scripts"
        mode: "a+X"
        recurse: yes
    
    - name: Download tools based on architecture
      block:
        - name: Download aarch64 tools
          when: ansible_architecture == "aarch64"
          ansible.builtin.shell: |
            mkdir -p /home/eulercopilot/tools
            curl -fL -o /home/eulercopilot/tools/helm-v3.15.0-linux-arm64.tar.gz \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/arm64/helm-v3.15.0-linux-arm64.tar.gz
            curl -fL -o /home/eulercopilot/tools/k3s-airgap-images-arm64.tar.zst \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/arm64/k3s-airgap-images-arm64.tar.zst
            curl -fL -o /home/eulercopilot/tools/k3s-arm64 \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/arm64/k3s-arm64
            curl -fL -o /home/eulercopilot/tools/k3s-install.sh \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/arm64/k3s-install.sh
          retries: 3
          delay: 5
          until: true

        - name: Download x86_64 tools
          when: ansible_architecture == "x86_64"
          ansible.builtin.shell: |
            mkdir -p /home/eulercopilot/tools
            curl -fL -o /home/eulercopilot/tools/helm-v3.15.0-linux-amd64.tar.gz \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/amd64/helm-v3.15.0-linux-amd64.tar.gz
            curl -fL -o /home/eulercopilot/tools/k3s \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/amd64/k3s
            curl -fL -o /home/eulercopilot/tools/k3s-airgap-images-amd64.tar.zst \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/amd64/k3s-airgap-images-amd64.tar.zst
            curl -fL -o /home/eulercopilot/tools/k3s-install.sh \
              https://repo.oepkgs.net/openEuler/rpm/openEuler-22.03-LTS/contrib/eulercopilot/tools/amd64/k3s-install.sh
          retries: 3
          delay: 5
          until: true

    # 临时规避EulerCopilot部署脚本中的一个参数覆盖问题
    - name: temporary bug fix 
      shell: >
        sed -i 's/local preserve_models="N"/local preserve_models="Y"/g' {{ repo_config.dest_dir }}/deploy/scripts/8-install-EulerCopilot/install_eulercopilot.sh
    
    - name: Execute one-click-deploy
      shell: >
        yes "" | bash {{ repo_config.dest_dir }}/deploy/scripts/0-one-click-deploy/one-click-deploy.sh >> "{{ log_dir }}/{{ timestamp }}.log"
