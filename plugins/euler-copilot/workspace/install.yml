- name: Install EulerCopilot
  hosts: all
  become: yes
  vars:
    timestamp: "{{ ansible_date_time.iso8601 }}"

  tasks:
    - name: Create log directory
      file:
        path: "{{ log_dir }}"
        state: directory
        mode: '0744'

    - name: Install python3-libselinux, git
      yum:
        name:
          - python3-libselinux
          - git
        state: present

    - name: git clone euler-copilot-framework
      ansible.builtin.git:
        repo: "{{ repo_config.url }}"
        dest: "{{ repo_config.dest_dir }}"
        version: "{{ repo_config.version }}"
        update: yes  # 如果目录存在，则执行 git pull 更新到指定 version
        force: "{{ repo_config.force }}"

    - name: Copy values.yaml template
      ansible.builtin.template:
        src: values.yaml.j2
        dest: "{{ repo_config.dest_dir }}/deploy/chart/euler_copilot/values.yaml"
        mode: "0644"
        backup: yes

    - name: Disable deploy-embedding.sh, deploy_deepseek.sh and install_ollama.sh script
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0770"                    # 可选：设置文件权限
        owner: root                      # 可选：设置文件所有者
        group: root                      # 可选：设置文件所属组
        backup: yes                      # 可选：启用备份
      loop:
        - { src: deploy-embedding.sh, dest: "{{ repo_config.dest_dir }}/deploy/scripts/3-install-ollama/install_ollama.sh" }
        - { src: deploy_deepseek.sh, dest: "{{ repo_config.dest_dir }}/deploy/scripts/4-deploy-deepseek/deploy_deepseek.sh" }
        - { src: install_ollama.sh, dest: "{{ repo_config.dest_dir }}/deploy/scripts/5-deploy-embedding/deploy-embedding.sh" }

    - name: Add execute permission to all deploy scripts recursively
      ansible.builtin.file:
        path: "{{ repo_config.dest_dir }}/deploy/scripts"
        mode: "a+X"
        recurse: yes

    - name: Execute one-click-deploy.sh
      shell: >
        sh {{ repo_config.dest_dir }}/deploy/scripts/0-one-click-deploy/one-click-deploy.sh
        &>"{{ log_dir }}/{{ timestamp }}.log"
