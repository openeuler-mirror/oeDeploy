name: kuberay
version: 1.0.0
url: https://gitee.com/openeuler/oeDeploy/tree/master/plugins/kuberay
description: oeDeploy plugin for kuberay(default kuberay-1.2.2 & ray-2.9.0) auto deployment
description_zh: 帮助开发者在本地快速部署kuberay(默认版本 kuberay-1.2.2 & ray-2.9.0)的oeDeploy插件。请确保当前节点是kubernetes集群的master节点。
description_en: >
  The oeDeploy plugin that helps developers quickly deploy kuberay(default kuberay-1.2.2 & ray-2.9.0) locally. 
  Please ensure that the current node is the master node of the kubernetes cluster.
type: app
localhost_available: true
action:
  install:
    description: install KubeRay
    tasks:
      - name: uninstall KubeRay
        playbook: uninstall.yml
        scope: all
      - name: install KubeRay
        playbook: install.yml
        scope: all
  uninstall:
    description: uninstall KubeRay
    tasks:
      - name: uninstall KubeRay
        playbook: uninstall.yml
        scope: all
  train:
    description: train MLP model based on FashionMNIST on KubeRay
    tasks:
      - name: train MLP model based on FashionMNIST on KubeRay
        playbook: train.yaml
        scope: all
