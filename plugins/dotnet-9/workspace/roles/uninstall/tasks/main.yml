- name: Remove .NET 9 packages for production environment
  package:
    name: "{{ item }}"
    state: absent
  loop: "{{ dotnet9_production_packages }}"
  when: environment_type == 'production'
  ignore_errors: yes

- name: Remove .NET 9 packages for development environment
  package:
    name: "{{ item }}"
    state: absent
  loop: "{{ dotnet9_development_packages }}"
  when: environment_type == 'development'
  ignore_errors: yes

- name: Verify .NET 9 has been removed
  shell: rpm -qa | grep dotnet || true
  register: dotnet_rpm_list

- debug:
    msg: "Remaining dotnet packages: {{ dotnet_rpm_list.stdout_lines }}"

- name: Remove .NET 9 repository file
  file:
    path: /etc/yum.repos.d/dotnet-9.repo
    state: absent

- name: Remove .NET environment variables
  file:
    path: /etc/profile.d/dotnet.sh
    state: absent

- name: Clean dnf cache
  shell: dnf clean all

- name: Display uninstallation result
  debug:
    msg: ".NET 9 uninstallation completed"